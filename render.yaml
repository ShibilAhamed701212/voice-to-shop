services:
  - type: web
    name: ps06-voice-booking
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MAKE_WEBHOOK_URL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ALLOW_RESET
        value: "true"
