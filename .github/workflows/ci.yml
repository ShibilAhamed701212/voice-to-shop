name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20 is the deploy runtime (Dockerfile, render.yaml); Vitest 5 needs Node 22.12+.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            mock-api/package-lock.json
            frontend/package-lock.json
      - run: npm --prefix mock-api ci
      - run: npm --prefix frontend ci
      - name: Typecheck
        run: npm --prefix mock-api run typecheck && npm --prefix frontend run typecheck
      - name: Test
        if: matrix.node != 20
        run: npm --prefix mock-api test
      - name: Build
        run: npm --prefix frontend run build && npm --prefix mock-api run build
